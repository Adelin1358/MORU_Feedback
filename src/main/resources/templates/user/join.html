<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>joinForm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
<div id="wrap" >
    <header class=" d-flex align-items-center">
        <h1 class="ml-3">MORU_FEEDBACK</h1>
    </header>
    <section class="contents   d-flex justify-content-center">
        <div class="user-box  p-4 my-5 rounded-lg">
            <h1 class="text-center">회원 가입</h1>

            <div class="d-flex mt-3 justify-content-between">
                <input type="text" class="form-control col-8 mr-3" placeholder="아이디" id="loginIdInput">
                <button type="button" class="btn btn-info btn-sm col-4" id="duplicateBtn">중복확인</button>
            </div>
            <div class="small text-success d-none" id="availableText">사용 가능한 ID 입니다.</div>
            <div class="small text-danger d-none" id="duplicateText">중복된 ID입니다.</div>

            <input type="password" class="form-control mt-2" placeholder="비밀번호" id="passwordInput">
            <input type="password" class="form-control mt-2" placeholder="비밀번호 확인" id="passwordConfirmInput">
            <input type="text" class="form-control mt-2" placeholder="이름" id="nameInput">
            <input type="text" class="form-control mt-2" placeholder="이메일" id="emailInput">
            <button type="button" class="btn btn-secondary btn-block mt-2" id="joinBtn">가입</button>
        </div>
    </section>
    <footer class=" d-flex align-items-center justify-content-center">
        <div>Copyright 2025. MORU All rights reserved.</div>
    </footer>
</div>
</body>

<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script>

    // 중복 확인 여부
    var isDuplicateCheck = false;

    // 아이디 중복 여부
    var isDuplicate = true;

    $("#idInput").on("input", function() {
        isDuplicateCheck = false;
        isDuplicate = true;
        $("#duplicateText").addClass("d-none");
        $("#availableText").addClass("d-none");
    });

    $("#duplicateBtn").on("click", function() {
        let id = $("#idInput").val();

        if(id == "") {
            alert("아이디를 입력하세요");
            return ;
        }

        $.ajax({
            type:"get"
            , url:"/user/duplicate-id"
            , data:{"loginId":id}
            , success:function(response) {

                isDuplicateCheck = true;

                isDuplicate = response.isDuplicate;
                if(response.isDuplicate) {
                    $("#duplicateText").removeClass("d-none");
                    $("#availableText").addClass("d-none");
                } else {
                    $("#availableText").removeClass("d-none");
                    $("#duplicateText").addClass("d-none");

                }
            }
            , error:function() {
                alert("중복확인 에러");
            }
        });

    });

    $("#joinBtn").on("click", function() {

        let id = $("#idInput").val();
        let password = $("#passwordInput").val();
        let passwordConfirm = $("#passwordConfirmInput").val();
        let name = $("#nameInput").val();
        let email = $("#emailInput").val();

        if(id == "") {
            alert("아이디를 입력하세요");
            return ;
        }

        // 중복확인 안한 경우
        if(!isDuplicateCheck) {
            alert("중복확인을 해주세요");
            return ;
        }

        // 아이디가 중복된 경우
        if(isDuplicate) {
            alert("중복 입니다.");
            return ;
        }

        if(password == "") {
            alert("비밀번호를 입력하세요");
            return ;
        }

        if(password != passwordConfirm) {
            alert("비밀번호가 일치하지 않습니다");
            return ;
        }

        if(name == "") {
            alert("이름을 입력하세요");
            return ;
        }

        if(email == "") {
            alert("이메일을 입력하세요");
            return ;
        }

        $.ajax({
            type:"post"
            , url:"/user/join-process"
            , data:{"loginId":id, "password":password, "name":name, "email":email}
            , success:function(response) {
                if(response.result == "success") {
                    location.href = "/user/login";
                } else {
                    alert("회원가입 실패");
                }

            }
            , error:function() {
                alert("회원가입 에러!");
            }
        });


    });
</script>

</html>
